[workspace]
members = ["app", "engine", "gui"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.6"
evdev = "0.12"
anyhow = "1.0"
log = "0.4"
flexi_logger = "0.31"
nix = { version = "0.29", features = ["signal", "fs", "poll"] }
dirs = "6.0.0"
eframe = "0.29"
egui = "0.29"
tray-icon = "0.24"
tokio = { version = "1.37", features = ["full"] }
async-trait = "0.1"
gtk = "0.18"
x11rb = "0.13"
arboard = "3.4.1"
sha2 = "0.10"
image = { version = "0.25", default-features = false }
smallvec = "1"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
