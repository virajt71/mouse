[package]
name = "mouser-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.6"
evdev = "0.12"
anyhow = "1.0"
log = "0.4"
flexi_logger = "0.31"
nix = { version = "0.29", features = ["signal", "fs", "poll"] }
lazy_static = "1.4"
x11rb = "0.13"
eframe = "0.29"
egui = "0.29"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "6.0.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
engine = { package = "mouser_engine", path = "engine" }
gui = { package = "mouser_gui", path = "gui" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[workspace]
members = ["engine", "gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
