[package]
name = "mouser_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.6"
evdev = "0.12"
anyhow = "1.0"
log = "0.4"
nix = { version = "0.29", features = ["signal", "fs", "poll"] }
x11rb = "0.13"
dirs = "6.0.0"
arboard = "3.4.1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "5"

smallvec = "1"

