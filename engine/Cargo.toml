[package]
name = "mouser_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.6"
evdev = "0.12"
anyhow = "1.0"
log = "0.4"
nix = { version = "0.29", features = ["signal", "fs", "poll"] }
lazy_static = "1.4"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }
dirs = "6.0.0"
arboard = "3.4.1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.38", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
bincode = "1.3"
mdns-sd = "0.11"
rustls-pki-types = "1.7"
rustls-pemfile = "2.1"
smallvec = "1"
