syntax = "proto3";
package mouser;

// ─── Common Types ─────────────────────────────────────────────────────────────

message Empty {}

message StringValue {
  string value = 1;
}

/// Stable per-device identity (mirrors mouser_engine::config::DeviceKey).
message DeviceKey {
  string serial = 1;
  string layout = 2;
}

message StatusResponse {
  bool ok = 1;
  string error_message = 2;
}

// ─── Config ───────────────────────────────────────────────────────────────────

/// Full serialised Config JSON blob. The GUI deserialises this into
/// mouser_engine::config::Config on receipt.
message ConfigResponse {
  string config_json = 1;
  uint64 generation   = 2;
}

message SettingsJson {
  /// Serialised mouser_engine::config::Settings JSON.
  string settings_json = 1;
}

// ─── Profiles ─────────────────────────────────────────────────────────────────

message ProfileMappingsRequest {
  string profile_name  = 1;
  /// JSON-serialised HashMap<String, String>
  string mappings_json = 2;
  /// Device the profile belongs to (per-device profile store).
  DeviceKey device     = 3;
}

/// Select / Add / Delete a profile on a specific device.
message DeviceProfileRequest {
  string name   = 1;
  DeviceKey device = 2;
}

message AppBindingsRequest {
  string profile_name = 1;
  string exec         = 2;
  /// Device the profile belongs to (per-device profile store).
  DeviceKey device     = 3;
}

message ProfileIconRequest {
  string profile_name = 1;
  /// Base64-encoded icon data string (same format stored in Config::Profile::icon)
  string icon_data    = 2;
  /// Device the profile belongs to (per-device profile store).
  DeviceKey device     = 3;
}

// ─── Device State ─────────────────────────────────────────────────────────────

message DeviceInfoResponse {
  bool   device_connected    = 1;
  string device_name         = 2;
  uint32 active_host_channel = 3;  // 0 = none
}

/// Mirrors mouser_engine::worker::DeviceStateUpdate
message DeviceStateResponse {
  bool   unifying_receiver_connected = 1;
  bool   bolt_receiver_connected     = 2;
  bool   bluetooth_available         = 3;
  string battery_pct                 = 4;
  bool   has_active_hidpp_battery    = 5;
  /// JSON array of [mac: string, name: string, is_connected: bool] triples
  string paired_devices_json         = 6;
  /// HID++ battery status label: "discharging", "charging", "full", etc.
  string battery_status              = 7;
}

// ─── Flow (pass-through query helpers) ────────────────────────────────────────

message FlowStatusResponse {
  bool is_searching = 1;
}

// ─── Actions Ring (server-push) ──────────────────────────────────────────────

/// Engine → GUI signal that opens or closes the Actions Ring overlay.
/// `layout_json` is a serialised `mouser_engine::config::actions_ring::ActionRingLayout`.
message ActionsRingState {
  bool   open        = 1;
  /// Unique id for this ring session (used to ignore stale close signals).
  uint64 session_id  = 2;
  /// JSON-serialised ActionRingLayout, present only when `open == true`.
  string layout_json = 3;
  /// JSON-serialised map of folder name → ActionRingLayout, present only when
  /// `open == true`. Slots with action id `folder:<name>` open these sub-rings.
  string folders_json = 4;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service MouserDaemon {
  // ── Config ──────────────────────────────────────────────────────────────
  rpc GetConfig           (Empty)          returns (ConfigResponse);
  rpc ReloadConfig        (Empty)          returns (StatusResponse);
  rpc UpdateSettings      (SettingsJson)   returns (StatusResponse);
  rpc UpdateKeyboardLayout(StringValue)    returns (StatusResponse);

  // ── Profiles ────────────────────────────────────────────────────────────
  rpc SelectProfile        (DeviceProfileRequest) returns (StatusResponse);
  rpc AddProfile           (DeviceProfileRequest) returns (StatusResponse);
  rpc DeleteProfile        (DeviceProfileRequest) returns (StatusResponse);
  rpc UpdateProfileMappings(ProfileMappingsRequest) returns (StatusResponse);
  rpc UpdateAppBindings    (AppBindingsRequest)   returns (StatusResponse);
  rpc SetProfileIcon       (ProfileIconRequest)   returns (StatusResponse);

  // ── Profile Groups ──────────────────────────────────────────────────────
  rpc SelectProfileGroup(StringValue) returns (StatusResponse);
  rpc AddProfileGroup   (StringValue) returns (StatusResponse);
  rpc DeleteProfileGroup(StringValue) returns (StatusResponse);

  // ── Device Info ─────────────────────────────────────────────────────────
  rpc GetDeviceInfo(Empty) returns (DeviceInfoResponse);
  rpc GetFlowStatus(Empty) returns (FlowStatusResponse);

  // ── Streaming (server-push) ─────────────────────────────────────────────
  rpc WatchConfig     (Empty) returns (stream ConfigResponse);
  rpc WatchDeviceState(Empty) returns (stream DeviceStateResponse);
  rpc WatchActionsRing(Empty) returns (stream ActionsRingState);

  // ── Pairing ─────────────────────────────────────────────────────────────
  rpc UnpairDevice(StringValue) returns (StatusResponse);

  // ── Actions Ring ──────────────────────────────────────────────────────────
  /// Execute a single action id by name (used by the ring overlay to run the
  /// action the user selected in a slot).
  rpc ExecuteAction(StringValue) returns (StatusResponse);
}
